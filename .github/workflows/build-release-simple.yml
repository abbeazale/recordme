name: Build and Release (Simple)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Build App
      run: |
        # Build for release without code signing
        xcodebuild -scheme recordme \
          -configuration Release \
          -derivedDataPath ./build \
          -destination 'generic/platform=macOS' \
          build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          DEVELOPMENT_TEAM=""
    
    - name: Find and Copy App
      run: |
        # Find the built app
        APP_PATH=$(find ./build -name "recordme.app" -type d | head -1)
        echo "Found app at: $APP_PATH"
        
        if [ ! -d "$APP_PATH" ]; then
          echo "❌ App not found after build"
          find ./build -name "*.app" -type d
          exit 1
        fi
        
        # Create output directory
        mkdir -p ./output
        cp -R "$APP_PATH" ./output/RecordMe.app
        ls -la ./output/
    
    - name: Create DMG
      run: |
        # Create a temporary DMG directory
        mkdir -p dmg-temp
        cp -R ./output/RecordMe.app dmg-temp/
        
        # Create DMG
        hdiutil create -volname "RecordMe" -srcfolder dmg-temp -ov -format UDZO RecordMe.dmg
        
        # Verify DMG was created
        ls -la RecordMe.dmg
    
    - name: Create Release with GitHub CLI
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        # Extract version from tag
        VERSION=${GITHUB_REF#refs/tags/}
        
        # Create release using GitHub CLI
        gh release create "$VERSION" RecordMe.dmg \
          --title "RecordMe $VERSION" \
          --notes "Automated release build for RecordMe $VERSION

**Download**: RecordMe.dmg

**Installation**: 
1. Download RecordMe.dmg
2. Open the DMG file
3. Drag RecordMe.app to your Applications folder
4. Right-click RecordMe in Applications → Open (first time only)
5. Grant screen recording permissions when prompted

**Note**: You may see a security warning on first launch - this is normal for unsigned apps. Right-click → Open to bypass."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}